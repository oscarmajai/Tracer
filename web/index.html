<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-top">
            <div class="sidebar-top-row">
                <span class="brand">Tracer</span>
                <button id="btnNotif" class="btn-notif" title="Activar notificaciones">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Device card -->
        <div class="device-card">
            <div class="device-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
            </div>
            <div class="device-meta">
                <p id="deviceName" class="device-name">—</p>
                <p id="deviceModel" class="device-model">—</p>
                <div class="device-status-row">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="statusText" class="status-text connecting">Connecting…</span>
                    <span id="lastSeen" class="last-seen"></span>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label-row">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="6" width="18" height="12" rx="2"/>
                        <line x1="23" y1="13" x2="23" y2="11"/>
                    </svg>
                    <span>BATTERY</span>
                </div>
                <p id="batteryValue" class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <div class="stat-label-row">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                        <line x1="12" y1="20" x2="12.01" y2="20"/>
                    </svg>
                    <span>SIGNAL</span>
                </div>
                <p id="signalValue" class="stat-value">—</p>
            </div>
        </div>

        <!-- Locate -->
        <button class="btn-locate" data-cmd="LOCATE">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
            </svg>
            Locate
        </button>

        <!-- Command grid -->
        <div class="cmd-grid">

            <button class="cmd-btn" data-cmd="BATTERY">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="6" width="18" height="12" rx="2"/>
                    <line x1="23" y1="13" x2="23" y2="11"/>
                </svg>
                <span>Battery</span>
            </button>

            <button class="cmd-btn" data-cmd="STATUS">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Status</span>
            </button>

            <button class="cmd-btn" data-cmd="ALERT" data-args="ON">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>Alert ON</span>
            </button>

            <button class="cmd-btn" data-cmd="ALERT" data-args="OFF">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    <path d="M18.63 13A17.89 17.89 0 0 1 18 8"/>
                    <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/>
                    <path d="M18 8a6 6 0 0 0-9.33-5"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                <span>Alert OFF</span>
            </button>

            <button class="cmd-btn" data-cmd="RING">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <span>Ring</span>
            </button>

            <button class="cmd-btn" data-cmd="RING" data-args="STOP">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
                <span>Ring Stop</span>
            </button>

            <button class="cmd-btn" data-cmd="PHOTO">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <span>Photo</span>
            </button>

            <button class="cmd-btn" data-cmd="LOCK" data-confirm="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Lock</span>
            </button>

        </div>

        <!-- Wipe -->
        <button class="btn-wipe" data-cmd="WIPE" data-wipe="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            Wipe
        </button>

        <p id="cmdFeedback" class="feedback"></p>

        <!-- Command Log -->
        <div class="history-section">
            <button class="history-header" id="cmdLogToggle">
                <div class="history-header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span>Command Log</span>
                </div>
                <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"/>
                </svg>
            </button>
            <ul id="cmdLogList" class="history-list">
                <li class="history-empty">No commands yet</li>
            </ul>
        </div>

        <!-- Location History -->
        <div class="history-section">
            <button class="history-header" id="historyToggle">
                <div class="history-header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>Location History</span>
                </div>
                <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"/>
                </svg>
            </button>
            <ul id="historyList" class="history-list">
                <li class="history-empty">Loading…</li>
            </ul>
        </div>

        <!-- Geofence -->
        <div class="history-section collapsed">
            <button class="history-header" id="geofenceToggle">
                <div class="history-header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="2" x2="12" y2="5"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="5" y2="12"/>
                        <line x1="19" y1="12" x2="22" y2="12"/>
                    </svg>
                    <span>Geofence</span>
                </div>
                <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"/>
                </svg>
            </button>
            <div id="geofenceBody" class="geofence-body hidden">
                <p id="geofenceStatus" class="geofence-status">Sin zona configurada</p>
                <label for="geofenceRadius">Radio (m)</label>
                <input id="geofenceRadius" type="number" min="50" max="50000" value="500" placeholder="500">
                <div class="geofence-actions">
                    <button id="btnGeofencePick" class="btn-geo-pick">Marcar en mapa</button>
                    <button id="btnGeofenceSave" class="btn-geo-save" disabled>Guardar</button>
                </div>
                <button id="btnGeofenceDelete" class="btn-geo-delete" style="display:none">Eliminar zona</button>
            </div>
        </div>

        <!-- Photos -->
        <section id="photoSection" class="photo-section" style="display:none">
            <p class="section-label">Fotos</p>
            <div id="photoGallery" class="photo-gallery"></div>
        </section>

        <!-- Settings -->
        <details class="settings-details">
            <summary class="settings-summary">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                Settings
            </summary>
            <div class="settings-form">
                <label for="apiUrl">API URL</label>
                <input id="apiUrl" type="url" placeholder="(same server)" autocomplete="off">
                <label for="apiToken">Token</label>
                <input id="apiToken" type="password" placeholder="TracerSecretToken123" autocomplete="off">
                <button id="btnSave" class="btn-save">Save &amp; reconnect</button>
            </div>
        </details>

    </aside>

    <main id="map"></main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

<!-- Login overlay — visible hasta que se verifique el token -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <p class="login-brand">Tracer</p>
        <p class="login-sub">Panel de control</p>
        <div class="login-form">
            <label for="loginUrl">URL del servidor</label>
            <input id="loginUrl" type="url" placeholder="https://tu-servidor.dev" autocomplete="off" spellcheck="false">
            <label for="loginToken">Token de acceso</label>
            <input id="loginToken" type="password" placeholder="Token API" autocomplete="off">
            <p id="loginError" class="login-error"></p>
            <button id="loginBtn" class="btn-login">Conectar</button>
        </div>
    </div>
</div>

</body>
</html>
