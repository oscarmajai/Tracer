  <div id="root"></div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('root');
      if (el && !el.children.length) {
        el.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;padding:24px;z-index:9999"><div style="background:#fee2e2;border:1px solid #dc2626;padding:20px;border-radius:8px;font-family:monospace;font-size:12px;max-width:700px;max-height:80vh;overflow:auto;white-space:pre-wrap"><strong>Error JavaScript:</strong>\n\n' + msg + '\n' + src + ':' + line + '\n\n' + (err ? err.stack : '') + '</div></div>';
      }
    };
  </script>
