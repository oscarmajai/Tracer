events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Cloudflare ya maneja TLS, aquí recibimos HTTP plano desde el tunnel
    server {
        listen 80;

        # Tamaño máximo para subida de fotos
        client_max_body_size 15M;

        # Headers que Cloudflare reenvía al backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para foto upload y polling de comandos
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Todo va al backend Go (sirve la API + el panel web estático)
        location / {
            proxy_pass http://tracer-api:3000;
        }
    }
}
